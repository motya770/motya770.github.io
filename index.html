<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matthew Kudelin</title>
  <meta name="description" content="Matthew Kudelin — Senior Data Scientist, AI Engineer and Software Developer in Tel Aviv">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="window" id="window">
    <header class="titlebar">
      <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
      <span class="title">guest@kudelin: ~</span>
    </header>

    <section class="meadow" aria-label="An animated pixel rabbit. Click it!">
      <canvas id="meadow"></canvas>
    </section>

    <section class="terminal" id="terminal">
      <div id="output" aria-live="polite"></div>
      <div class="input-line" id="input-line">
        <span class="prompt"></span>
        <span class="typed" id="typed"></span>
        <input id="cmd" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Terminal command">
      </div>
    </section>
  </main>

  <script src="rabbit.js"></script>
  <script src="main.js"></script>
</body>
</html>
